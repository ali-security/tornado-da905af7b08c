# The "build" workflow produces wheels (and the sdist) for all python
# versions/platforms. Where possible (i.e. the build is not a cross-compile),
# the test suite is also run for the wheel (this test covers fewer
# configurations than the "test" workflow and tox.ini).
name: Build

on:
  workflow_dispatch:
    # Allow this workflow to be run manually (pushing to testpypi instead of pypi)

env:
  python-version: '3.9'

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: ${{ env.python-version }}
      - name: Pin release-era setuptools
        # The 6.4.1 sdist was built with the setuptools 58.1.0 bundled with
        # Python 3.9 at the time (Metadata-Version 2.1, no auto-included .pyi).
        run: "python -m pip install setuptools==58.1.0"

      - name: Check metadata
        run: "python setup.py check"
      - name: Build sdist
        run: "python setup.py sdist && ls -l dist"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-sdist
          path: ./dist/tornado-*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            archs_linux: auto
          - os: ubuntu-24.04-arm
            archs_linux: aarch64
          - os: windows-2022
            archs_linux: auto
          - os: macos-15
            archs_linux: auto

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        if: runner.os != 'macOS'
        with:
          python-version: ${{ env.python-version }}
      - uses: MatteoH2O1999/setup-python@v4
        name: Install Python (macOS arm64)
        if: runner.os == 'macOS'
        with:
          python-version: ${{ env.python-version }}
          cache-build: true
          allow-build: allow
      - name: Set up QEMU
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.18
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.archs_linux }}
          CIBW_ENVIRONMENT: "PIP_INDEX_URL=https://:2024-06-06T18:36:10.575984Z@time-machines-pypi.sealsecurity.io/"
          # pyproject's test-command plus --verbose, so every test (and each
          # skipped test with its reason) is named in the log. aarch64 now
          # builds on a native arm runner, so it runs the full suite rather
          # than pyproject's emulation-only websocket_test override.
          CIBW_TEST_COMMAND_LINUX: "python -m tornado.test --verbose"
          CIBW_TEST_COMMAND_MACOS: "python -m tornado.test --verbose"
          CIBW_TEST_COMMAND_WINDOWS: "python -m tornado.test --fail-if-logs=false --verbose"
          # Install tox.ini's "full" test extras so the curl/twisted/c-ares
          # tests run against each wheel instead of being skipped. pycurl has
          # no manylinux2014/musllinux wheel, so the Linux containers get the
          # libcurl headers to build it (manylinux2014 is CentOS 7, whose
          # mirrors moved to vault.centos.org after EOL; its libcurl uses NSS,
          # which pycurl must be told or the import fails at runtime).
          # Windows gets no pycurl: tornado's curl client fails there and
          # upstream never tests it on Windows.
          CIBW_TEST_REQUIRES: "pycurl twisted pycares"
          CIBW_TEST_REQUIRES_WINDOWS: "twisted pycares"
          CIBW_BEFORE_TEST_LINUX: >-
            if command -v apk >/dev/null 2>&1; then apk add --no-cache curl-dev;
            else sed -i -e 's/^mirrorlist=/#mirrorlist=/' -e 's|^#\{0,1\}baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|' -e 's|\$releasever|7.9.2009|g' /etc/yum.repos.d/*.repo
            && yum install -y --disablerepo='centos-sclo*' libcurl-devel
            && PYCURL_SSL_LIBRARY=nss pip install --no-cache-dir pycurl
            && python -c "import pycurl; print(pycurl.version)"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
